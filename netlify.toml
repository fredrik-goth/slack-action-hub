[build]
  # No static frontend — all traffic goes through Netlify Functions
  publish = "public"
  command = "npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Redirect /slack/events → function (set this as your Slack Request URL)
[[redirects]]
  from = "/slack/events"
  to = "/.netlify/functions/slack"
  status = 200

# Redirect Google OAuth callback
[[redirects]]
  from = "/oauth/google/callback"
  to = "/.netlify/functions/oauth-google"
  status = 200

# Morning digest — Mon–Fri 09:00 UTC
[functions."digest"]
  schedule = "0 9 * * 1-5"
